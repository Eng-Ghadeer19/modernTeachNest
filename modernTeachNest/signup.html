<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <style>
         * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }



          .site-navbar {
            background: #ffffff;
            border-radius: 14px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .site-navbar .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
        }

        .site-navbar .logo img {
            width: 90px;
            display: block;
        }

        .site-navbar .navbar ul {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .site-navbar .navbar ul li a {
            text-decoration: none;
            color: #333;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .site-navbar .navbar ul li a:hover {
            color: #4e4376;
        }

        .site-navbar .login {
            text-decoration: none;
            background: #4e4376;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .site-navbar .login:hover {
            background: #2b5876;
        }

        @media (max-width: 768px) {
            .site-navbar .navbar {
                flex-direction: column;
                gap: 14px;
            }

            .site-navbar .navbar ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px;
            }
        }
        body {
    min-height: 100vh;
    /* display: flex;
    justify-content: center;
    align-items: center; */
    /* background: linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
                url("img/signup-bg.jpg") center center / cover no-repeat; */
                background: url("img/signup-bg.jpg") center center / cover no-repeat;
}
.form{
   display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column; 
     background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    padding: 40px;
       max-width: 420px;
    width: 100%;
    margin: 0 auto;
}
input{
    padding: 10px 14px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s ease;
}
 input:focus {
    outline: none;
    border-color: #4e4376;
}
.top {
 display: flex;
    flex-direction: column;
    margin-bottom: 18px;
}
label{
      font-size: 0.9rem;
    font-weight: 600;
    color: #4e4376;
    margin-bottom: 6px;
}
.submit {
    width: 100%;
    padding: 12px;
    background: #4e4376;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s ease;
}

.submit:hover {
    background: #2b5876;
}
.header-section {
    text-align: center;
    margin-bottom: 30px;
}

.already-account {
    text-align: center;
    margin-top: 16px;
    font-size: 0.9rem;
    color: #555;
}

.already-account a {
    color: #4e4376;
    font-weight: 600;
    text-decoration: none;
}

.already-account a:hover {
    text-decoration: underline;
}

.header-section h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #2b1a4a;
    margin-bottom: 8px;
}

.header-section p {
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
    </style>
</head>
<body>

    <header class="site-navbar">
        <div class="navbar">
            <div class="logo">
                <a href="index.html"><img src="img/logo.jfif" alt="logo"></a>
            </div>
            <ul>
                <li><a href="index.html#Home">Home</a></li>
                <li><a href="index.html#About">About</a></li>
                <li><a href="index.html#Courses">Courses</a></li>
                <li><a href="index.html#books">Resources</a></li>
                <li><a href="index.html#Instructors">Instructors</a></li>
            </ul>
            <a class="login" href="index.html#login">Login</a>
        </div>
    </header>
    <div class="header-section">
        <h1>Create Your Account</h1>
        <p>Start learning with courses, projects, and resources built for beginners.</p>
    </div>
    <div class="form">
    <form action="">
        <div class="top">
        <label for="">First Name</label>
        <input type="text">
        </div>
        <div class="top">
            <label for="">Last Name</label>
            <input type="text">
        </div>
        <div class="top">
            <label for="">Email Address</label>
            <input type="text">
        </div>
        <div class="top">
            <label for="">Password</label>
            <input type="password">
        </div>

        <input class="submit" type="submit" value="Continue">

        <p class="already-account">Already have an account? <a href="index.html#login">Log in</a></p>
    </form>
    </div>
</body>
</html>
